<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>404 — Page Not Found · Footage</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
        }
        .error-code {
            font-size: clamp(5rem, 12vw, 9rem);
            font-family: var(--font-heading);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 12px;
            color: #0F172A;
        }
    </style>
</head>
<body>
    <div class="ambient-lighting-layer" aria-hidden="true">
        <div class="ambient-wash wash-top-right"></div>
        <div class="ambient-wash wash-bottom-right"></div>
    </div>

    <header class="navbar">
        <div class="wrap nav-container">
            <a href="./" class="brand" aria-label="Footage home">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                </div>
                <span>footage</span>
            </a>
            <nav class="nav-links">
                <a href="./">Return to Home</a>
            </nav>
        </div>
    </header>

    <main class="error-hero">
        <div class="error-code">404</div>
        <h2 style="font-size: 1.8rem; margin-bottom: 14px; color: var(--text-heading);">This page doesn't exist.</h2>
        <p style="color: var(--text-muted); max-width: 440px; margin-bottom: 30px;">
            The link you clicked might be outdated or the page has moved. Let's get you back to your best memories.
        </p>
        <a href="./" class="btn-submit" style="text-decoration: none; padding: 14px 28px;">
            <span>Back to Footage</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
    </main>
</body>
</html>
